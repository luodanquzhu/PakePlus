        function removeVideoEvidence() {
            currentVideoData = null;
            currentVideoDuration = 0;
            renderAttachList();
            updateSubmitState();
        }

        // =============================================================
        //  🎤 音频打卡
        // =============================================================
        let audioRecorder = null;
        let audioChunks = [];
        let audioTimerInterval = null;
        let audioStartTime = 0;
        let audioBlob = null;

        async function openAudioCheckin() {
            if (!selectedPerson) return showToast('请先选择打卡人', 'warning');
            audioChunks = [];
            audioBlob = null;
            document.getElementById('audioPlaybackWrap').style.display = 'none';
            document.getElementById('audioHint').textContent = '点击麦克风开始录音';
            document.getElementById('audioTimer').style.display = 'none';
            document.getElementById('audioWave').style.display = 'flex';
            document.getElementById('audioRecBtn').className = 'rec-btn-lg start';
            document.getElementById('audioRecBtn').textContent = '🎤';
            document.getElementById('audioModal').classList.add('show');

            // 立即开始录音
            setTimeout(() => toggleAudioRecording(), 300);
        }

        async function toggleAudioRecording() {
            const btn = document.getElementById('audioRecBtn');
            if (audioRecorder && audioRecorder.state === 'recording') {
                audioRecorder.stop();
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                audioRecorder = new MediaRecorder(stream);
                audioRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                audioRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    audioBlob = blob;
                    currentAudioData = await blobToBase64(blob);
                    currentAudioDuration = Math.floor((Date.now() - audioStartTime) / 1000);
                    stream.getTracks().forEach(t => t.stop());

                    const playback = document.getElementById('audioPlayback');
                    playback.src = currentAudioData;
                    document.getElementById('audioPlaybackWrap').style.display = 'block';
                    document.getElementById('audioHint').textContent = '✅ 录音完成，点击「保存音频」';
                    document.getElementById('audioRecBtn').className = 'rec-btn-lg start';
                    document.getElementById('audioRecBtn').textContent = '🎤';
                    document.getElementById('audioTimer').style.display = 'none';
                    clearInterval(audioTimerInterval);
                };
                audioRecorder.start();
                audioStartTime = Date.now();
                btn.className = 'rec-btn-lg stop';
                btn.textContent = '⏹';
                document.getElementById('audioHint').textContent = '录音中…再次点击停止';
                document.getElementById('audioTimer').style.display = 'flex';
                document.getElementById('audioTimerText').textContent = '00:00';
                audioTimerInterval = setInterval(() => {
                    const s = Math.floor((Date.now() - audioStartTime) / 1000);
                    document.getElementById('audioTimerText').textContent = formatTime(s);
                }, 200);
            } catch (err) {
                showToast('无法访问麦克风：' + err.message, 'error');
            }
        }

        function closeAudioModal() {
            if (audioRecorder && audioRecorder.state === 'recording') {
                try { audioRecorder.stop(); } catch (_) {}
            }
            clearInterval(audioTimerInterval);
            document.getElementById('audioModal').classList.remove('show');
        }

        function saveAudioCheckin() {
            if (!currentAudioData) return showToast('请先录音', 'warning');
            closeAudioModal();
            renderAttachList();
            updateSubmitState();
            showToast('✅ 音频已保存', 'success');
        }

        // =============================================================
        //  🎬 视频打卡
        // =============================================================
        let videoRecorder = null;
        let videoChunks = [];
        let videoTimerInterval = null;
        let videoStartTime = 0;
        let videoStream = null;
        let currentFacing = 'environment';

        async function openVideoCheckin() {
            if (!selectedPerson) return showToast('请先选择打卡人', 'warning');
            videoChunks = [];
            document.getElementById('videoPlaybackWrap').style.display = 'none';
            document.getElementById('videoHint').textContent = '点击开始录像，再次点击停止';
            document.getElementById('videoTimer').style.display = 'none';
            document.getElementById('videoRecBtn').className = 'rec-btn-lg start';
            document.getElementById('videoRecBtn').textContent = '🎬';
            document.getElementById('videoModal').classList.add('show');

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacing },
                    audio: true
                });
                document.getElementById('videoEl').srcObject = videoStream;
            } catch (err) {
                showToast('无法访问摄像头：' + err.message, 'error');
                closeVideoModal();
            }
        }

        async function switchCamera() {
            if (videoRecorder && videoRecorder.state === 'recording') {
                return showToast('录像中不能切换摄像头', 'warning');
            }
            currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
            if (videoStream) {
                videoStream.getTracks().forEach(t => t.stop());
            }
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacing },
                    audio: true
                });
                document.getElementById('videoEl').srcObject = videoStream;
                showToast('已切换到' + (currentFacing === 'user' ? '前置' : '后置') + '摄像头', 'info');
            } catch (err) {
                showToast('切换失败：' + err.message, 'error');
            }
        }

        function toggleVideoRecording() {
            const btn = document.getElementById('videoRecBtn');
            if (videoRecorder && videoRecorder.state === 'recording') {
                videoRecorder.stop();
                return;
            }
            if (!videoStream) return showToast('摄像头未准备好', 'warning');

            try {
                videoChunks = [];
                videoRecorder = new MediaRecorder(videoStream);
                videoRecorder.ondataavailable = e => { if (e.data.size > 0) videoChunks.push(e.data); };
                videoRecorder.onstop = async () => {
                    const blob = new Blob(videoChunks, { type: 'video/webm' });
                    currentVideoData = await blobToBase64(blob);
                    currentVideoDuration = Math.floor((Date.now() - videoStartTime) / 1000);
                    const pb = document.getElementById('videoPlayback');
                    pb.src = currentVideoData;
                    document.getElementById('videoPlaybackWrap').style.display = 'block';
                    document.getElementById('videoHint').textContent = '✅ 录像完成，点击「保存视频」';
                    document.getElementById('videoRecBtn').className = 'rec-btn-lg start';
                    document.getElementById('videoRecBtn').textContent = '🎬';
                    document.getElementById('videoTimer').style.display = 'none';
                    clearInterval(videoTimerInterval);
                };
                videoRecorder.start();
                videoStartTime = Date.now();
                btn.className = 'rec-btn-lg stop';
                btn.textContent = '⏹';
                document.getElementById('videoHint').textContent = '录像中…再次点击停止';
                document.getElementById('videoTimer').style.display = 'flex';
                document.getElementById('videoTimerText').textContent = '00:00';
                videoTimerInterval = setInterval(() => {
                    const s = Math.floor((Date.now() - videoStartTime) / 1000);
                    document.getElementById('videoTimerText').textContent = formatTime(s);
                }, 200);
            } catch (err) {
                showToast('录像失败：' + err.message, 'error');
            }
        }

        function closeVideoModal() {
            if (videoRecorder && videoRecorder.state === 'recording') {
                try { videoRecorder.stop(); } catch (_) {}
            }
            if (videoStream) {
                videoStream.getTracks().forEach(t => t.stop());
                videoStream = null;
            }
            clearInterval(videoTimerInterval);
            document.getElementById('videoModal').classList.remove('show');
        }

        function saveVideoCheckin() {
            if (!currentVideoData) return showToast('请先录像', 'warning');
            closeVideoModal();
            renderAttachList();
            updateSubmitState();
            showToast('✅ 视频已保存', 'success');
        }

        // =============================================================
        //  提交打卡
        // =============================================================
        function submitCheckin() {
            if (!selectedPerson) return showToast('请选择打卡人', 'warning');
            const mins = Math.floor(seconds / 60);
            if (mins < 1 && !currentAudioData && !currentVideoData) {
                return showToast('请至少打卡1分钟或录制音频/视频', 'warning');
            }

            const score = calcScore(mins);
            const today = getTodayStr();

            const record = {
                id: 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
                date: today,
                person: selectedPerson,
                duration: mins,
                score: score,
                book: document.getElementById('bookName').value.trim(),
                chapter: document.getElementById('bookChapter').value.trim(),
                unit: document.getElementById('bookUnit').value.trim(),
                section: document.getElementById('bookSection').value.trim(),
                audioData: currentAudioData,
                audioDuration: currentAudioDuration,
                videoData: currentVideoData,
                videoDuration: currentVideoDuration,
                review: '',
                reviewAudio: null
            };

            appData.checkins.push(record);
            saveData(appData);

            // 清空
            document.getElementById('bookName').value = '';
            document.getElementById('bookChapter').value = '';
            document.getElementById('bookUnit').value = '';
            document.getElementById('bookSection').value = '';
            currentAudioData = null;
            currentVideoData = null;
            currentAudioDuration = 0;
            currentVideoDuration = 0;
            renderAttachList();

            seconds = 0;
            updateDisplay();
            document.getElementById('btnSubmit').disabled = true;
            document.getElementById('btnStart').disabled = false;
            document.getElementById('btnStart').textContent = '▶ 开始';
            document.getElementById('btnPause').disabled = true;
            document.getElementById('btnStop').disabled = true;
            timerRunning = false; timerPaused = false;
            document.getElementById('timerStatus').textContent = '✅ 已提交！';

            renderAll();
            const p = PERSONS.find(x => x.id === selectedPerson);
            showToast(`🎉 ${p.name} 打卡成功！+${score}分`, 'success');

            // 自动打开读后感
            setTimeout(() => openReviewModal(record.id), 600);
        }

        // =============================================================
        //  ✨ 读后感（录音 + AI 编辑）
        // =============================================================
        let currentReviewId = null;
        let reviewRecorder = null;
        let reviewChunks = [];
        let reviewTimerInterval = null;
        let reviewStartTime = 0;
        let speechRecognition = null;
        let finalTranscript = '';

        function openReviewModal(recordId) {
            const rec = appData.checkins.find(c => c.id === recordId);
            if (!rec) return;
            currentReviewId = recordId;

            const p = PERSONS.find(x => x.id === rec.person);
            const metaParts = [];
            if (p) metaParts.push(`${p.avatar} ${p.name}`);
            metaParts.push(`⏱ ${rec.duration}分钟`);
            if (rec.book) metaParts.push(`📕《${rec.book}》`);
            if (rec.chapter) metaParts.push(rec.chapter);
            if (rec.unit) metaParts.push(rec.unit);
            if (rec.section) metaParts.push(rec.section);
            document.getElementById('reviewMetaInfo').innerHTML = metaParts.join(' · ');

            // 重置
            document.getElementById('reviewText').value = rec.review || '';
            document.getElementById('reviewAsrText').textContent = '识别结果会显示在这里…';
            document.getElementById('reviewAsrText').classList.add('empty');
            document.getElementById('reviewAsrStatus').textContent = '';
            document.getElementById('reviewRecHint').textContent = '点击麦克风开始录音';
            document.getElementById('reviewPreviewPlaceholder').style.display = 'block';
            document.getElementById('reviewWave').style.display = 'none';
            document.getElementById('reviewTimer').style.display = 'none';
            document.getElementById('reviewRecBtn').className = 'rec-btn-lg start';
            document.getElementById('reviewRecBtn').textContent = '🎤';
            finalTranscript = '';

            document.getElementById('reviewModal').classList.add('show');
        }

        function closeReviewModal() {
            if (reviewRecorder && reviewRecorder.state === 'recording') {
                try { reviewRecorder.stop(); } catch (_) {}
            }
            if (speechRecognition) {
                try { speechRecognition.stop(); } catch (_) {}
            }
            clearInterval(reviewTimerInterval);
            document.getElementById('reviewModal').classList.remove('show');
            currentReviewId = null;
        }

        async function toggleReviewRecording() {
            const btn = document.getElementById('reviewRecBtn');
            if (reviewRecorder && reviewRecorder.state === 'recording') {
                reviewRecorder.stop();
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                reviewChunks = [];
                reviewRecorder = new MediaRecorder(stream);
                reviewRecorder.ondataavailable = e => { if (e.data.size > 0) reviewChunks.push(e.data); };
                reviewRecorder.onstop = async () => {
                    const blob = new Blob(reviewChunks, { type: 'audio/webm' });
                    const b64 = await blobToBase64(blob);
                    const rec = appData.checkins.find(c => c.id === currentReviewId);
                    if (rec) { rec.reviewAudio = b64; saveData(appData); }
                    stream.getTracks().forEach(t => t.stop());

                    document.getElementById('reviewRecBtn').className = 'rec-btn-lg start';
                    document.getElementById('reviewRecBtn').textContent = '🎤';
                    document.getElementById('reviewRecHint').textContent = '✅ 录音完成，可点击 AI 编辑';
                    document.getElementById('reviewTimer').style.display = 'none';
                    document.getElementById('reviewWave').style.display = 'none';
                    document.getElementById('reviewPreviewPlaceholder').style.display = 'block';
                    document.getElementById('reviewPreviewPlaceholder').textContent = '🎤 录音已保存';
                    clearInterval(reviewTimerInterval);
                };
                reviewRecorder.start();
                reviewStartTime = Date.now();
                btn.className = 'rec-btn-lg stop';
                btn.textContent = '⏹';
                document.getElementById('reviewRecHint').textContent = '录音中…再次点击停止';
                document.getElementById('reviewTimer').style.display = 'flex';
                document.getElementById('reviewTimerText').textContent = '00:00';
                document.getElementById('reviewWave').style.display = 'flex';
                document.getElementById('reviewPreviewPlaceholder').style.display = 'none';
                reviewTimerInterval = setInterval(() => {
                    const s = Math.floor((Date.now() - reviewStartTime) / 1000);
                    document.getElementById('reviewTimerText').textContent = formatTime(s);
                }, 200);

                // 同时启动语音识别
                startSpeechRecognition();
            } catch (err) {
                showToast('无法访问麦克风：' + err.message, 'error');
            }
        }

        function startSpeechRecognition() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                document.getElementById('reviewAsrStatus').textContent = '⚠️ 当前环境不支持语音识别，可手动输入';
                return;
            }
            try {
                if (speechRecognition) { try { speechRecognition.stop(); } catch(_){} }
                speechRecognition = new SR();
                speechRecognition.lang = 'zh-CN';
                speechRecognition.continuous = true;
                speechRecognition.interimResults = true;
                finalTranscript = '';

                speechRecognition.onstart = () => {
                    document.getElementById('reviewAsrStatus').textContent = '🎙️ 识别中…';
                };
                speechRecognition.onresult = (e) => {
                    let interim = '';
                    for (let i = e.resultIndex; i < e.results.length; i++) {
                        const tr = e.results[i][0].transcript;
                        if (e.results[i].isFinal) finalTranscript += tr;
                        else interim += tr;
                    }
                    const shown = (finalTranscript + interim).trim();
                    const el = document.getElementById('reviewAsrText');
                    if (shown) {
                        el.textContent = shown;
                        el.classList.remove('empty');
                    }
                };
                speechRecognition.onerror = (e) => {
                    document.getElementById('reviewAsrStatus').textContent = '识别出错：' + (e.error || '未知');
                };
                speechRecognition.onend = () => {
                    document.getElementById('reviewAsrStatus').textContent =
                        finalTranscript ? '✅ 识别完成' : '未识别到内容';
                };
                speechRecognition.start();
            } catch (err) {
                document.getElementById('reviewAsrStatus').textContent = '⚠️ 语音识别启动失败';
            }
        }

        /** AI 智慧编辑：把语音识别结果整理成通顺的读后感 */
        function generateReview() {
            if (!currentReviewId) return;
            const rec = appData.checkins.find(c => c.id === currentReviewId);
            if (!rec) return;

            const asrText = document.getElementById('reviewAsrText').textContent.trim();
            const hasAsr = asrText && asrText !== '识别结果会显示在这里…';

            if (!hasAsr) {
                return showToast('请先录音，或手动输入读后感', 'warning');
            }

            const btn = document.getElementById('btnGenerate');
            btn.disabled = true;
            const orig = btn.innerHTML;
            btn.innerHTML = '<span>🪄</span> AI 编辑中<span class="loading-dots"><span></span><span></span><span></span></span>';

            setTimeout(() => {
                const review = smartEditReview(asrText, rec);
                document.getElementById('reviewText').value = review;
                btn.disabled = false;
                btn.innerHTML = orig;
                showToast('✨ AI 编辑完成', 'success');
            }, 700);
        }

        /** 智能整理口语化文字为书面读后感 */
        function smartEditReview(rawText, rec) {
            const person = PERSONS.find(x => x.id === rec.person);
            const pName = person ? person.name : '我';
            const book = rec.book || '这本书';
            const chapter = rec.chapter ? ('的' + rec.chapter) : '';

            // 清理：去掉语气词、重复
            let text = rawText
                .replace(/嗯+|啊+|呃+|那个|这个|就是说|然后呢|反正/g, '')
                .replace(/\s+/g, ' ')
                .trim();

            // 拆分句子
            const sentences = text
                .split(/[。！!?？\n]+/)
                .map(s => s.trim())
                .filter(s => s.length > 0);

            // 提取关键词
            const allWords = text.split(/[\s,，。、！!?？;；:：]+/).filter(w => w.length >= 2);
            const uniqueWords = [...new Set(allWords)];

            const feelings = uniqueWords.filter(w => /[高兴开心快乐感动难过伤心生气害怕敬佩佩服惊讶紧张激动兴奋]/.test(w));
            const lessons = uniqueWords.filter(w => /[明白懂得学到知道领悟启发道理启示成长进步收获]/.test(w));
            const plots = uniqueWords.filter(w => /[故事发生打做走看听读写想说]/.test(w));
            const chars = uniqueWords.filter(w => /[孙悟空唐僧猪八戒师傅妖怪国王]/.test(w) || (w.length <= 5 && /[他她它]/.test(w)));

            // 组合
            const p1 = `今天${pName}读了《${book}》${chapter}，${sentences[0] ? sentences[0] : '读得津津有味'}。`;

            let p2 = '';
            if (sentences.length > 1) {
                const midSentences = sentences.slice(1, 4).join('。');
                p2 = midSentences + '。';
            } else if (plots.length) {
                p2 = `其中印象最深刻的是${plots.slice(0,3).join('、')}这部分内容。`;
            } else {
                p2 = `故事内容十分精彩，读起来让人欲罢不能。`;
            }

            let p3 = '';
            if (feelings.length) {
                p3 = `读完以后，我感到特别${feelings.slice(0,2).join('、')}。`;
            } else {
                p3 = `读完以后，我的心里久久不能平静。`;
            }

            let p4 = '';
            if (lessons.length) {
                p4 = `通过这次阅读，我${lessons.slice(0,2).join('、')}了很多道理。`;
            } else {
                p4 = `通过这次阅读，我收获了很多，也成长了很多。`;
            }

            const p5 = `我会把这份阅读的快乐一直延续下去，以后读更多的好书！`;

            return `${p1}\n\n${p2}\n\n${p3}\n\n${p4}\n\n${p5}`;
        }

        function saveReview() {
            if (!currentReviewId) return;
            const rec = appData.checkins.find(c => c.id === currentReviewId);
            if (!rec) return;

            rec.review = document.getElementById('reviewText').value.trim();
            saveData(appData);
            closeReviewModal();
            renderAll();
            showToast('💾 读后感已保存', 'success');
        }

        // =============================================================
        //  渲染全部 / 清除 / 重置
        // =============================================================
        function renderAll() {
            renderWeekOverview();
            renderPersons();
            renderTodayRecords();
            renderBookSummaries();
            renderRankList();
            renderWeekSummary();
            document.getElementById('totalScore').textContent = calcTotalScore();
        }

        function clearAllCheckins() {
            if (!confirm('确定清除所有打卡记录吗？（包括读后感）')) return;
            appData.checkins = [];
            appData.bookSummaries = {};
            saveData(appData);
            renderAll();
            showToast('已清除所有打卡', 'info');
        }

        function resetAll() {
            if (!confirm('重置所有数据？')) return;
            appData = getDefaultData();
            saveData(appData);
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            timerRunning = false; timerPaused = false;
            seconds = 0;
            selectedPerson = null;
            window._selectedPerson = null;
            currentAudioData = null;
            currentVideoData = null;
            currentAudioDuration = 0;
            currentVideoDuration = 0;
            updateDisplay();
            document.getElementById('btnStart').disabled = false;
            document.getElementById('btnStart').textContent = '▶ 开始';
            document.getElementById('btnPause').disabled = true;
            document.getElementById('btnStop').disabled = true;
            document.getElementById('btnSubmit').disabled = true;
            document.getElementById('timerSubjectLabel').textContent = '👆 请先选择打卡人';
            document.getElementById('timerStatus').textContent = '选择打卡人后开始';
            renderAttachList();
            renderAll();
            showToast('已重置', 'info');
        }

        // =============================================================
        //  初始化
        // =============================================================
        renderAll();
        window.addEventListener('beforeunload', () => saveData(appData));
    </script>
</body>
